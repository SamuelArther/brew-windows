name: bottles

# Builds Windows bottles for a batch of upstream homebrew-core formulae. Only formulae that
# build, pass `brew test` and bottle cleanly are added to the tap; the rest are reported.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Names file under tools/batches (without .txt)
        required: true
      chunk_size:
        description: Formulae per build machine
        default: "25"
      toolchain:
        description: Install the MSYS2 C/C++ toolchain on build machines
        type: boolean
        default: false
      from_run:
        description: Only publish the bottles a previous run built (its run id)
        default: ""
      formula_timeout:
        description: Minutes one formula may build (LLVM, Qt, GHC... need hours; use chunk_size 1)
        default: "45"

permissions:
  contents: write
  actions: write

concurrency:
  group: bottles-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  plan:
    if: inputs.from_run == ''
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
    steps:
      - uses: actions/checkout@v5
      - id: split
        shell: python
        run: |
          import json, os
          names = open(f"tools/batches/${{ inputs.batch }}.txt").read().split()
          size = int("${{ inputs.chunk_size }}")
          chunks = [{"id": i, "names": " ".join(names[s:s + size])} for i, s in enumerate(range(0, len(names), size))]
          assert len(chunks) <= 256, "split the batch: at most 256 chunks per run"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("chunks=" + json.dumps(chunks) + "\n")

  build:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-brew
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Build, test and bottle
        shell: pwsh
        run: |
          $names = "${{ matrix.chunk.names }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          python tools/import_upstream.py "$env:RUNNER_TEMP/homebrew-core" @names
          dotnet build src/Brew -c Release --nologo -v q
          ./tools/ci/Build-Bottles.ps1 -Names $names -Out bottles -TimeoutMinutes ${{ inputs.formula_timeout }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bottles-${{ matrix.chunk.id }}
          path: bottles
          retention-days: 7
      # Logs and reports on their own, so triage doesn't download the bottles.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.chunk.id }}
          path: |
            bottles/logs
            bottles/report-*.json
          retention-days: 14

  publish:
    needs: build
    # A chunk that runs out of time ends "cancelled"; the other chunks' bottles still publish. Only a run
    # someone cancels skips this.
    if: always() && !cancelled() && (needs.build.result != 'skipped' || inputs.from_run != '')
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-brew
      # Not actions/download-artifact: it saw only the first 100 of a run's artifacts (a 78-chunk run has 156),
      # so a third of the chunks' bottles and reports were silently left out. gh pages through all of them.
      - name: Download bottles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.from_run || github.run_id }} --repo "${{ github.repository }}" --pattern 'bottles-*' --dir downloaded
          if ($LASTEXITCODE -ne 0) { throw "could not download the bottles" }
          New-Item -ItemType Directory -Force bottles | Out-Null
          $chunks = @(Get-ChildItem downloaded -Directory)
          foreach ($chunk in $chunks) { Copy-Item (Join-Path $chunk.FullName '*') bottles -Recurse -Force }
          "downloaded $($chunks.Count) chunks: $(@(Get-ChildItem bottles -Filter 'report-*.json').Count) reports, $(@(Get-ChildItem bottles -Filter '*.bottle.json').Count) bottles"
      - name: Report
        shell: pwsh
        run: |
          $report = @(Get-ChildItem bottles -Filter 'report-*.json' | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json } | ForEach-Object { $_ })
          # A bottle only exists once build and test passed; count it even if its chunk died before reporting.
          foreach ($json in Get-ChildItem bottles -Filter '*.bottle.json') {
            foreach ($bottled in (Get-Content $json.FullName -Raw | ConvertFrom-Json).PSObject.Properties.Name) {
              if ($report.name -notcontains $bottled) { $report += [pscustomobject]@{ name = $bottled; status = 'ok'; seconds = 0 } }
            }
          }
          $report = $report | Sort-Object name
          New-Item -ItemType Directory -Force tools/batches/results | Out-Null
          $report | ConvertTo-Json -AsArray | Set-Content "tools/batches/results/${{ inputs.batch }}.json"
          $report | Group-Object status | ForEach-Object { "{0}: {1}" -f $_.Name, $_.Count } | Tee-Object -Variable summary
          "### ${{ inputs.batch }}`n" + ($summary -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY
          # Kept an array: splatting a single name as a string passes it one character at a time.
          $ok = @(($report | Where-Object status -eq 'ok').name)
          if ($ok) { python tools/import_upstream.py "$env:RUNNER_TEMP/homebrew-core" @ok }
      # Bottles go to their own repository (Bottles.DefaultDomain), which needs a token that can write
      # there: the BOTTLES_TOKEN secret. Without it they stay in this repository, which brew still checks.
      - name: Publish bottles
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOTTLES_TOKEN || github.token }}
          BOTTLES_REPO: ${{ secrets.BOTTLES_TOKEN && format('{0}-bottles', github.repository) || github.repository }}
        run: |
          dotnet build src/Brew -c Release --nologo -v q
          "publishing to $env:BOTTLES_REPO"
          ./tools/ci/Publish-Bottles.ps1 -Dir bottles -Repo $env:BOTTLES_REPO
      - name: Commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tap tools/batches/results
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "nothing to commit"; exit 0 }
          $count = (git diff --cached --name-only -- tap | Measure-Object).Count
          git commit -q -m "${{ inputs.batch }}: add Windows bottles ($count formulae)"
          for ($i = 0; $i -lt 5; $i++) { git pull -q --rebase; git push -q; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep 10 }
          exit 1
      # GitHub holds one waiting run per concurrency group and cancels it when another is queued, so
      # batches wait in tools/batches/queue.txt instead and each run starts the next as it finishes.
      # A line is `<batch> [chunk_size=N] [toolchain=true] [formula_timeout=M] [from_run=ID]`.
      - name: Next batch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run already waiting (a manual or sync dispatch) would be cancelled by a new one; it starts the queue when it finishes.
          $jq = '[.[] | select(.databaseId != ${{ github.run_id }} and (.status == "pending" or .status == "queued" or .status == "waiting"))] | length'
          $waiting = gh run list --workflow bottles.yml --json status,databaseId --jq $jq
          if ($waiting -ne '0') { "a bottles run is already waiting; it will start the next batch"; exit 0 }
          # A failed publish leaves imported tap files behind; they would block the pull.
          git reset -q --hard HEAD
          git clean -qfd tap
          for ($i = 0; $i -lt 5; $i++) {
            git pull -q --rebase
            $queue = if (Test-Path tools/batches/queue.txt) { @(Get-Content tools/batches/queue.txt | Where-Object { $_ -match '\S' -and $_ -notmatch '^\s*#' }) } else { @() }
            if ($queue.Count -eq 0) { "queue is empty"; exit 0 }
            $next = $queue[0]
            $rest = @(Get-Content tools/batches/queue.txt | Where-Object { $_ -ne $next })
            Set-Content tools/batches/queue.txt $rest
            git add tools/batches/queue.txt
            git commit -q -m "queue: start $(($next -split '\s+')[0])"
            git push -q
            if ($LASTEXITCODE -eq 0) { break }
            git reset -q --hard origin/main
          }
          if ($LASTEXITCODE -ne 0) { throw "could not update the queue" }
          $words = $next.Trim() -split '\s+'
          $inputs = @('-f', "batch=$($words[0])")
          foreach ($word in $words | Select-Object -Skip 1) { $inputs += @('-f', $word) }
          "starting: $next"
          gh workflow run bottles.yml @inputs
