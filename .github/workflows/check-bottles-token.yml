name: check-bottles-token

# One-off: report what the BOTTLES_TOKEN secret may do, without printing it.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.BOTTLES_TOKEN }}
        run: |
          # Creating a ref to a commit that doesn't exist never succeeds: 422 means the token may write there,
          # 403 means it may not. Nothing is changed either way.
          for repo in brew-windows-bottles brew-windows; do
            out=$(gh api -X POST "repos/SamuelArther/$repo/git/refs" -f ref=refs/heads/token-check -f sha=0000000000000000000000000000000000000000 2>&1 || true)
            echo "$repo write test: $(echo "$out" | grep -oE 'HTTP [0-9]+|Resource not accessible[^"]*|Object does not exist|Reference update failed' | head -1)"
          done
          echo "private repos visible: $(gh api 'user/repos?visibility=private' --jq length 2>&1)"
