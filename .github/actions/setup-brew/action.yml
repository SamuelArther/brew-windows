name: Set up brew-windows
description: .NET 10, LLVM-MinGW (for the shim), and homebrew-core at tools/upstream-commit.txt
inputs:
  toolchain:
    description: Install the MSYS2 UCRT64 C/C++ toolchain (for building C formulae)
    default: "false"
runs:
  using: composite
  steps:
    # Fully updated: a partial `pacman -Sy` upgrade can leave tools on a mismatched runtime.
    - name: MSYS2 toolchain
      if: inputs.toolchain == 'true'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        path-type: inherit
        install: >-
          base-devel
          autotools
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-pkgconf
    - name: Point brew at MSYS2
      if: inputs.toolchain == 'true'
      shell: pwsh
      run: |
        $root = "${{ steps.msys2.outputs.msys2-location }}"
        if (-not (Test-Path "$root\usr\bin\bash.exe")) { throw "no MSYS2 at $root" }
        "HOMEBREW_MSYS2_ROOT=$root" | Add-Content $env:GITHUB_ENV
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"
    - name: LLVM-MinGW
      shell: pwsh
      run: |
        $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
        Invoke-WebRequest https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip -OutFile $zip
        Expand-Archive $zip "$env:RUNNER_TEMP" -Force
        "$env:RUNNER_TEMP\llvm-mingw-20260616-ucrt-x86_64\bin" | Add-Content $env:GITHUB_PATH
    - name: homebrew-core
      shell: pwsh
      run: |
        $core = "$env:RUNNER_TEMP\homebrew-core"
        $commit = (Get-Content tools/upstream-commit.txt).Trim()
        git init -q $core
        git -C $core remote add origin https://github.com/Homebrew/homebrew-core.git
        git -C $core sparse-checkout set Formula Patches
        git -C $core fetch -q --depth 1 --filter=blob:none origin $commit
        git -C $core checkout -q FETCH_HEAD
    - name: Brew environment
      shell: pwsh
      run: |
        "BREW_REPOSITORY=$env:GITHUB_WORKSPACE" | Add-Content $env:GITHUB_ENV
        "HOMEBREW_PREFIX=$env:LOCALAPPDATA\Homebrew" | Add-Content $env:GITHUB_ENV
        # Runner profiles lack a Documents folder, which SHGetFolderPath (and so some tools) treats as an error.
        New-Item -ItemType Directory -Force "$env:USERPROFILE\Documents" | Out-Null
        $folders = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders'
        if (-not (Test-Path $folders)) { New-Item $folders | Out-Null }
        if (-not (Get-ItemProperty $folders -Name Personal -ErrorAction SilentlyContinue)) {
          New-ItemProperty $folders -Name Personal -PropertyType ExpandString -Value '%USERPROFILE%\Documents' | Out-Null
        }
        "Documents: $([Environment]::GetFolderPath('MyDocuments'))"
